[package]
name = "delink-ng"
version = "0.2.0"
edition = "2024"
description = "A crypto library to decrypt various encrypted D-Link firmware images."
repository = "https://github.com/binwalk-ng/delink-ng"
license = "MIT"
keywords = ["firmware", "dlink", "decrypt", "cryptography", "embedded"]
categories = ["cryptography", "security", "command-line-utilities"]
exclude = ["/.github", "/.gitignore", "/prek.toml"]

[lints.clippy]
redundant_type_annotations = "warn"
redundant_clone = "warn"
redundant_as_str = "warn"
panic = "warn"

[dependencies]
hex = "0.4.3"
log = "0.4.22"
md-5 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.0"
sha1 = "0.11.0"
hmac = "0.13.0"
aes = "0.9.1"
cbc = "0.2.1"

# Only used for the binary, not the library
env_logger = { version = "0.11.5", optional = true }

[features]
# Keep the library dependency-free by default: the `cli` feature (and its
# env_logger dependency) is only needed to run the command-line binary, not to
# use the crate as a library.
default = []
# Enables logging for the command-line binary only.
cli = ["dep:env_logger"]
